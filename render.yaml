# Render Blueprint — DamzD WhatsApp bot
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: damzd
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.9.0"
      - key: BOT_NAME
        value: DamzD
      - key: OWNER_NAME
        sync: false    # your name, e.g. Layo
      - key: OWNER_NUMBER
        sync: false    # international format, no + — e.g. 2348000000000
      - key: GROQ_API_KEY
        sync: false    # free key from console.groq.com
      # PAIRING_CODE is intentionally NOT set: codes rotate (fresh random 8-digit
      # one per request) so a dead code is always visible on the dashboard. Set a
      # fixed 8-char A-Z0-9 value here only if you really want a constant code.
      - key: ACCESS_MODE
        value: public
      - key: PREFIX
        value: "."
      - key: AUTO_DL
        value: "true"
      - key: LOG_LEVEL
        value: warn
      # Optional: free key from apis.nabeestech.com restores .aio/.yt video
      # downloads. Songs via .song work without it (JioSaavn engine).
      - key: NABEES_API_KEY
        sync: false
      # Optional: the owner's free Puter account token unlocks the REAL
      # flagship brains — .claude (Claude Sonnet), .chatgpt (GPT) and
      # .gemini (Gemini) — through puter.ai.chat. Without it those commands
      # fall back to the built-in chain automatically.
      - key: PUTER_AUTH_TOKEN
        sync: false
